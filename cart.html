<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — FLUX ROOT SERVICES</title>
  <meta name="theme-color" content="#0a0908" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">F</span>
        FLUX <span>ROOT</span>
      </a>
      <nav class="nav">
        <a href="index.html">Shop</a>
        <a href="orders.html">Orders</a>
        <a href="cart.html" class="cart-btn active">
          Cart
          <span class="cart-count" style="display:none">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Your Cart</h1>
    <p class="page-sub">Review your services before checkout.</p>
    <div id="cart-content"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 FLUX ROOT SERVICES</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function renderCart() {
      const wrap = document.getElementById("cart-content");
      const cart = getCart();

      if (cart.length === 0) {
        wrap.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🛒</div>
            <h3>Cart is empty</h3>
            <p>Browse services and add them to your cart.</p>
            <a href="index.html" class="btn" style="margin-top:1.25rem;display:inline-flex">Browse Services</a>
          </div>`;
        return;
      }

      const itemsHtml = cart
        .map((item) => {
          const p = PRODUCTS.find((x) => x.id === item.id);
          if (!p) return "";
          const sub = p.price * item.qty;
          return `
            <div class="cart-item">
              <div class="cart-item-info">
                <h4>${p.name}</h4>
                <p>₱${p.price.toLocaleString()} × ${item.qty} = ₱${sub.toLocaleString()}</p>
              </div>
              <div class="cart-item-actions">
                <div class="qty-control">
                  <button onclick="changeQty('${p.id}', ${item.qty - 1})" aria-label="Decrease">−</button>
                  <span>${item.qty}</span>
                  <button onclick="changeQty('${p.id}', ${item.qty + 1})" aria-label="Increase">+</button>
                </div>
                <button class="remove-btn" onclick="removeItem('${p.id}')">Remove</button>
              </div>
            </div>`;
        })
        .join("");

      const total = getCartTotal();

      wrap.innerHTML = `
        <div class="cart-list">${itemsHtml}</div>
        <div class="cart-summary">
          <div class="cart-summary-row">
            <span>Subtotal</span>
            <span>₱${total.toLocaleString()}</span>
          </div>
          <div class="cart-summary-row total">
            <span>Total</span>
            <span>₱${total.toLocaleString()} PHP</span>
          </div>
        </div>
        <div class="cart-actions">
          <a href="checkout.html" class="btn btn-lg btn-block">Proceed to Checkout</a>
          <a href="index.html" class="btn btn-outline btn-block">Continue Shopping</a>
        </div>
      `;
    }

    function changeQty(id, qty) {
      setQty(id, qty);
      renderCart();
    }

    function removeItem(id) {
      removeFromCart(id);
      renderCart();
      showToast("Removed from cart");
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (typeof loadProducts === "function") await loadProducts();
      renderCart();
    });
  </script>
</body>
</html>
