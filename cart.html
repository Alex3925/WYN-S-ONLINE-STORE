<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — WYN'S SARI SARI STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">WYN'S <span>SARI SARI</span></a>
      <nav class="nav">
        <a href="index.html">Shop</a>
        <a href="orders.html">Orders</a>
        <a href="cart.html" class="cart-btn active">
          Cart
          <span class="cart-count" style="display:none">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Your Cart</h1>
    <div id="cart-content"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 WYN'S SARI SARI STORE</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function renderCart() {
      const wrap = document.getElementById("cart-content");
      const cart = getCart();

      if (cart.length === 0) {
        wrap.innerHTML = `
          <div class="empty">
            <h3>Cart is empty</h3>
            <p>Browse services and add them to your cart.</p>
            <a href="index.html" class="btn" style="margin-top:1rem;display:inline-flex">Go to Shop</a>
          </div>`;
        return;
      }

      let itemsHtml = cart
        .map((item) => {
          const p = PRODUCTS.find((x) => x.id === item.id);
          if (!p) return "";
          const sub = p.price * item.qty;
          return `
            <div class="cart-item">
              <div class="cart-item-info">
                <h4>${p.name}</h4>
                <p>₱${p.price.toLocaleString()} × ${item.qty} = ₱${sub.toLocaleString()}</p>
              </div>
              <div class="cart-item-actions">
                <div class="qty-control">
                  <button onclick="changeQty('${p.id}', ${item.qty - 1})" aria-label="Decrease">−</button>
                  <span>${item.qty}</span>
                  <button onclick="changeQty('${p.id}', ${item.qty + 1})" aria-label="Increase">+</button>
                </div>
                <button class="remove-btn" onclick="removeItem('${p.id}')">Remove</button>
              </div>
            </div>`;
        })
        .join("");

      const total = getCartTotal();

      wrap.innerHTML = `
        <div class="cart-list">${itemsHtml}</div>
        <div class="cart-summary">
          <div class="cart-summary-row">
            <span>Subtotal</span>
            <span>₱${total.toLocaleString()}</span>
          </div>
          <div class="cart-summary-row total">
            <span>Total</span>
            <span>₱${total.toLocaleString()} PHP</span>
          </div>
        </div>
        <a href="checkout.html" class="btn btn-block">Proceed to Checkout</a>
        <a href="index.html" class="btn btn-outline btn-block" style="margin-top:0.6rem">Continue Shopping</a>
      `;
    }

    function changeQty(id, qty) {
      setQty(id, qty);
      renderCart();
    }

    function removeItem(id) {
      removeFromCart(id);
      renderCart();
      showToast("Removed from cart");
    }

    document.addEventListener("DOMContentLoaded", renderCart);
  </script>
</body>
</html>
