<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order History — FLUX ROOT SERVICES</title>
  <meta name="theme-color" content="#0a0908" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">F</span>
        FLUX <span>ROOT</span>
      </a>
      <nav class="nav">
        <a href="index.html">Shop</a>
        <a href="orders.html" class="active">Orders</a>
        <a href="cart.html" class="cart-btn">
          Cart
          <span class="cart-count" style="display:none">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Order History</h1>
    <p class="page-sub">Enter your Telegram username to see live order status from our system.</p>

    <div class="toolbar" style="margin-bottom:1.25rem">
      <div class="search-wrap" style="flex:1">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z" />
        </svg>
        <input type="text" id="lookup-user" placeholder="@telegram username" autocomplete="off" />
      </div>
      <button class="btn" id="lookup-btn">Look up</button>
    </div>

    <div id="orders-list"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 FLUX ROOT SERVICES</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    const LOOKUP_KEY = "flux_lookup_tg";

    function renderLocalFallback() {
      const orders = getOrders();
      if (orders.length === 0) {
        document.getElementById("orders-list").innerHTML = `
          <div class="empty">
            <div class="empty-icon">—</div>
            <h3>No orders yet</h3>
            <p>Enter your Telegram username above after placing an order.</p>
          </div>`;
        return;
      }
      showOrders(orders, true);
    }

    function showOrders(orders, fromLocal) {
      const wrap = document.getElementById("orders-list");
      if (!orders.length) {
        wrap.innerHTML = `
          <div class="empty">
            <div class="empty-icon">—</div>
            <h3>No orders found</h3>
            <p>Check the username or place an order first.</p>
          </div>`;
        return;
      }
      wrap.innerHTML =
        (fromLocal
          ? `<p style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.75rem">Showing device cache — look up by Telegram for live status.</p>`
          : "") +
        orders
          .map((o) => {
            const date = new Date(o.date);
            const dateStr = date.toLocaleString(undefined, {
              dateStyle: "medium",
              timeStyle: "short"
            });
            const itemsStr = (o.items || []).map((i) => `${i.name} × ${i.qty}`).join(", ");
            const isPending = o.status === "pending";
            return `
              <div class="order-card">
                <div class="order-header">
                  <div>
                    <div class="order-id">${o.id}</div>
                    <div class="order-date">${dateStr}</div>
                  </div>
                  <span class="order-status ${isPending ? "pending" : "completed"}">${(o.status || "pending").toUpperCase()}</span>
                </div>
                <p class="order-items-line">${itemsStr}</p>
                <p class="order-total">₱${Number(o.total).toLocaleString()} PHP</p>
                ${o.telegramUsername ? `<p class="order-meta">Telegram: @${o.telegramUsername}</p>` : ""}
                ${o.deviceName ? `<p class="order-meta">Device: ${o.deviceName}</p>` : ""}
                ${o.buildNumber ? `<p class="order-meta">Build: ${o.buildNumber}</p>` : ""}
                ${o.ref ? `<p class="order-meta">Ref: ${o.ref}</p>` : ""}
                ${o.note ? `<p class="order-meta">Note: ${o.note}</p>` : ""}
              </div>`;
          })
          .join("");
    }

    async function lookup() {
      const input = document.getElementById("lookup-user");
      const user = input.value.trim().replace(/^@/, "");
      if (!user) {
        renderLocalFallback();
        return;
      }
      localStorage.setItem(LOOKUP_KEY, user);
      const wrap = document.getElementById("orders-list");
      wrap.innerHTML = `<p style="color:var(--text-muted)">Loading…</p>`;
      try {
        const res = await fetch(`/api/orders?telegram=${encodeURIComponent(user)}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          wrap.innerHTML = `<div class="empty"><h3>Could not load</h3><p>${data.error || "Try again"}</p></div>`;
          return;
        }
        showOrders(data.orders || [], false);
      } catch (e) {
        wrap.innerHTML = `<div class="empty"><h3>Network error</h3><p>${e.message}</p></div>`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem(LOOKUP_KEY);
      if (saved) {
        document.getElementById("lookup-user").value = saved;
        lookup();
      } else {
        renderLocalFallback();
      }
      document.getElementById("lookup-btn").addEventListener("click", lookup);
      document.getElementById("lookup-user").addEventListener("keydown", (e) => {
        if (e.key === "Enter") lookup();
      });
    });
  </script>
</body>
</html>
