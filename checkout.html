<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — WYN'S SARI SARI STORE</title>
  <meta name="theme-color" content="#08090b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">W</span>
        WYN'S <span>SARI SARI</span>
      </a>
      <nav class="nav">
        <a href="index.html">Shop</a>
        <a href="orders.html">Orders</a>
        <a href="cart.html" class="cart-btn">
          Cart
          <span class="cart-count" style="display:none">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Checkout</h1>
    <p class="page-sub">Pay via Maya QR, then confirm your order.</p>
    <div id="checkout-content"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 WYN'S SARI SARI STORE</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // === CONFIG — replace with your real details ===
    const TELEGRAM_LINK = "https://t.me/YOUR_TELEGRAM";
    const MAYA_QR_SRC = "assets/maya-qr.png";

    function renderCheckout() {
      const wrap = document.getElementById("checkout-content");
      const cart = getCart();

      if (cart.length === 0) {
        wrap.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🧾</div>
            <h3>Nothing to checkout</h3>
            <p>Your cart is empty.</p>
            <a href="index.html" class="btn" style="margin-top:1.25rem;display:inline-flex">Browse Services</a>
          </div>`;
        return;
      }

      const total = getCartTotal();
      const itemsList = cart
        .map((item) => {
          const p = PRODUCTS.find((x) => x.id === item.id);
          if (!p) return "";
          return `<li><span>${p.name} × ${item.qty}</span><span>₱${(p.price * item.qty).toLocaleString()}</span></li>`;
        })
        .join("");

      wrap.innerHTML = `
        <div class="checkout-grid">
          <div class="checkout-card">
            <h3><span class="step-num">1</span> Scan &amp; Pay with Maya</h3>
            <div class="qr-box">
              <img id="maya-qr" src="${MAYA_QR_SRC}" alt="Maya QR Code"
                   onerror="this.style.display='none'; document.getElementById('qr-fallback').style.display='flex';" />
              <div id="qr-fallback" class="qr-placeholder" style="display:none">
                Place your Maya QR image at<br><code>assets/maya-qr.png</code>
              </div>
              <p class="qr-amount">₱${total.toLocaleString()}</p>
            </div>
            <p class="qr-note">Open the Maya app → Scan this QR → Pay the exact amount shown.</p>
          </div>

          <div class="checkout-card">
            <h3><span class="step-num">2</span> Order Summary</h3>
            <ul class="order-items">${itemsList}</ul>
            <div class="cart-summary-row total" style="margin-top:0.85rem;padding-top:0.85rem;border-top:1px solid var(--border)">
              <span>Total</span>
              <span>₱${total.toLocaleString()} PHP</span>
            </div>

            <div style="margin-top:1.35rem">
              <div class="form-group">
                <label for="ref">Payment reference (optional)</label>
                <input type="text" id="ref" placeholder="Maya ref or last 4 digits" />
              </div>
              <div class="form-group">
                <label for="note">Device / notes (recommended)</label>
                <textarea id="note" rows="2" placeholder="Phone model, Android version, etc."></textarea>
              </div>
              <button class="btn btn-lg btn-block" id="confirm-btn">I've Paid — Create Order</button>
            </div>
          </div>
        </div>

        <div class="checkout-help">
          <h3>After payment</h3>
          <p>
            Click the button above to save your order. Then message us on Telegram with your
            <strong>Order ID</strong> so we can deliver the service.
          </p>
          <a href="${TELEGRAM_LINK}" target="_blank" rel="noopener" class="btn btn-outline btn-block">Open Telegram</a>
        </div>
      `;

      document.getElementById("confirm-btn").addEventListener("click", placeOrder);
    }

    function placeOrder() {
      const cart = getCart();
      if (cart.length === 0) return;

      const total = getCartTotal();
      const ref = document.getElementById("ref").value.trim();
      const note = document.getElementById("note").value.trim();
      const orderId = generateOrderId();

      const items = cart.map((item) => {
        const p = PRODUCTS.find((x) => x.id === item.id);
        return {
          id: item.id,
          name: p ? p.name : item.id,
          price: p ? p.price : 0,
          qty: item.qty
        };
      });

      const order = {
        id: orderId,
        date: new Date().toISOString(),
        items,
        total,
        ref: ref || null,
        note: note || null,
        status: "pending"
      };

      saveOrder(order);
      clearCart();

      const lines = [
        `Order ${orderId}`,
        `Total: ₱${total.toLocaleString()}`,
        ref ? `Ref: ${ref}` : null,
        note ? `Note: ${note}` : null,
        "",
        ...items.map((i) => `• ${i.name} × ${i.qty}`)
      ].filter(Boolean);

      const tgText = encodeURIComponent(lines.join("\n"));
      const tgUrl = TELEGRAM_LINK.includes("?")
        ? TELEGRAM_LINK
        : `${TELEGRAM_LINK}?text=${tgText}`;

      document.getElementById("checkout-content").innerHTML = `
        <div class="success-box">
          <div class="success-icon">✓</div>
          <h3>Order created</h3>
          <div class="order-id-display">${orderId}</div>
          <p>
            Send this Order ID and payment proof on Telegram so we can process and deliver your service.
          </p>
          <div class="success-actions">
            <a href="${tgUrl}" target="_blank" rel="noopener" class="btn btn-lg btn-block">Message on Telegram</a>
            <a href="orders.html" class="btn btn-outline btn-block">View Order History</a>
            <a href="index.html" class="btn btn-outline btn-block">Back to Shop</a>
          </div>
        </div>
      `;
      showToast("Order saved!");
    }

    document.addEventListener("DOMContentLoaded", renderCheckout);
  </script>
</body>
</html>
